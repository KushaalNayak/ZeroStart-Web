<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="zs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="100" height="100" rx="20" fill="#000000"/>

  <!-- Subtle blue border glow -->
  <rect width="100" height="100" rx="20" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>

  <!-- Inner glass panel -->
  <rect x="4" y="4" width="92" height="92" rx="17" fill="#0a0a0a" opacity="0.8"/>

  <!-- Stylized Z stroke with gradient and glow -->
  <path
    d="M22 30 H78 L22 70 H78"
    stroke="url(#zs-grad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
</svg>
